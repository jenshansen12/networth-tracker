<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Net Worth Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
        }

        .current-nw {
            font-size: 3em;
            font-weight: bold;
            margin: 20px 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .card h2 {
            margin-bottom: 15px;
            color: #2d3748;
        }

        .input-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        input {
            padding: 12px 15px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 1em;
            flex: 1;
            min-width: 150px;
            outline: none;
            transition: border-color 0.3s;
        }

        input:focus {
            border-color: #667eea;
        }

        button {
            padding: 12px 25px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        button:hover {
            background: #5a67d8;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102,126,234,0.3);
        }

        .delete-btn {
            background: #fc8181;
            padding: 6px 12px;
            font-size: 0.85em;
            border-radius: 6px;
        }

        .delete-btn:hover {
            background: #f56565;
            transform: translateY(-1px);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-label {
            font-size: 0.85em;
            opacity: 0.9;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 1.3em;
            font-weight: bold;
        }

        .stat-percent {
            font-size: 0.85em;
            margin-top: 3px;
            opacity: 0.9;
        }

        .chart-container {
            height: 300px;
            margin-top: 20px;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            border-bottom: 1px solid #e2e8f0;
            transition: background 0.2s;
        }

        .history-item:hover {
            background: #f7fafc;
        }

        .message {
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: none;
        }

        .success {
            background: #f0fff4;
            color: #2f855a;
            border: 1px solid #c6f6d5;
        }

        .error {
            background: #fff5f5;
            color: #c53030;
            border: 1px solid #fed7d7;
        }

        .loading-state {
            text-align: center;
            padding: 40px;
            color: #a0aec0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💰 Net Worth Tracker</h1>
            <p>Your Financial Journey</p>
            <div class="current-nw" id="currentNetWorth">$0.00</div>
        </div>

        <div class="card">
            <h2>📝 Add Daily Entry</h2>
            <div class="message" id="message"></div>
            <div class="input-group">
                <input type="date" id="dateInput" />
                <input type="number" id="amountInput" placeholder="Net worth in USD" step="0.01" />
                <button onclick="addEntry()">💾 Save</button>
            </div>
        </div>

        <div class="card">
            <h2>📈 Performance</h2>
            <div class="stats-grid" id="statsGrid">
                <p style="color: #a0aec0;">No data yet</p>
            </div>
        </div>

        <div class="card">
            <h2>📊 Net Worth Chart</h2>
            <div class="chart-container">
                <canvas id="chartCanvas"></canvas>
            </div>
        </div>

        <div class="card">
            <h2>📋 History</h2>
            <div id="historyList">
                <p class="loading-state">Loading your data...</p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script>
        // ==========================================
        // YOUR SUPABASE DETAILS
        // ==========================================
        const SUPABASE_URL = 'https://cntbpwailsgbsgyiuqvo.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNudGJwd2FpbHNnYnNneWl1cXZvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc4MjQ4NjYsImV4cCI6MjA5MzQwMDg2Nn0.XCHUlqlrZ8v4m7CKpDLUE408nBJ6G6yHynSKKTyMeKQ';
        
        let chart = null;

        const formatCurrency = (amount) => {
            return new Intl.NumberFormat('en-US', {
                style: 'currency',
                currency: 'USD',
                minimumFractionDigits: 2
            }).format(amount);
        };

        const showMessage = (text, type = 'success') => {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.className = `message ${type}`;
            msg.style.display = 'block';
            setTimeout(() => msg.style.display = 'none', 3000);
        };

        // Fetch all entries from Supabase
        async function fetchEntries() {
            try {
                const response = await fetch(
                    `${SUPABASE_URL}/rest/v1/networth?select=*&order=date.asc`,
                    {
                        headers: {
                            'apikey': SUPABASE_KEY,
                            'Authorization': `Bearer ${SUPABASE_KEY}`,
                            'Content-Type': 'application/json'
                        }
                    }
                );
                
                if (!response.ok) throw new Error('Failed to fetch');
                const entries = await response.json();
                updateDisplay(entries);
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('historyList').innerHTML = 
                    '<p class="loading-state" style="color: #c53030;">⚠️ Error loading data. Please try again.</p>';
            }
        }

        // Add or update entry
        async function addEntry() {
            const date = document.getElementById('dateInput').value;
            const amount = document.getElementById('amountInput').value;

            if (!date || !amount) {
                showMessage('Please fill in both date and amount', 'error');
                return;
            }

            try {
                // First check if date already exists
                const checkResponse = await fetch(
                    `${SUPABASE_URL}/rest/v1/networth?date=eq.${date}&select=id`,
                    {
                        headers: {
                            'apikey': SUPABASE_KEY,
                            'Authorization': `Bearer ${SUPABASE_KEY}`
                        }
                    }
                );
                
                const existing = await checkResponse.json();
                
                if (existing.length > 0) {
                    // Update existing entry
                    const updateResponse = await fetch(
                        `${SUPABASE_URL}/rest/v1/networth?id=eq.${existing[0].id}`,
                        {
                            method: 'PATCH',
                            headers: {
                                'apikey': SUPABASE_KEY,
                                'Authorization': `Bearer ${SUPABASE_KEY}`,
                                'Content-Type': 'application/json',
                                'Prefer': 'return=minimal'
                            },
                            body: JSON.stringify({ amount: parseFloat(amount) })
                        }
                    );
                    
                    if (!updateResponse.ok) throw new Error('Update failed');
                    showMessage('✅ Entry updated!');
                } else {
                    // Insert new entry
                    const insertResponse = await fetch(
                        `${SUPABASE_URL}/rest/v1/networth`,
                        {
                            method: 'POST',
                            headers: {
                                'apikey': SUPABASE_KEY,
                                'Authorization': `Bearer ${SUPABASE_KEY}`,
                                'Content-Type': 'application/json',
                                'Prefer': 'return=minimal'
                            },
                            body: JSON.stringify({
                                date: date,
                                amount: parseFloat(amount)
                            })
                        }
                    );
                    
                    if (!insertResponse.ok) throw new Error('Insert failed');
                    showMessage('✅ Entry saved!');
                }

                document.getElementById('amountInput').value = '';
                fetchEntries();
            } catch (error) {
                showMessage('❌ Failed to save. Please try again.', 'error');
                console.error('Error:', error);
            }
        }

        // Delete entry
        async function deleteEntry(id) {
            if (!confirm('Are you sure you want to delete this entry?')) return;

            try {
                const response = await fetch(
                    `${SUPABASE_URL}/rest/v1/networth?id=eq.${id}`,
                    {
                        method: 'DELETE',
                        headers: {
                            'apikey': SUPABASE_KEY,
                            'Authorization': `Bearer ${SUPABASE_KEY}`,
                            'Content-Type': 'application/json'
                        }
                    }
                );
                
                if (!response.ok) throw new Error('Delete failed');
                
                showMessage('🗑️ Entry deleted');
                fetchEntries();
            } catch (error) {
                showMessage('Failed to delete entry', 'error');
                console.error('Error:', error);
            }
        }

        // Update the display
        function updateDisplay(entries) {
            if (!entries || entries.length === 0) {
                document.getElementById('currentNetWorth').textContent = '$0.00';
                document.getElementById('statsGrid').innerHTML = '<p style="color: #a0aec0;">Add your first entry above</p>';
                document.getElementById('historyList').innerHTML = '<p class="loading-state">No entries yet. Start tracking your net worth!</p>';
                if (chart) chart.destroy();
                return;
            }

            // Update current net worth
            const current = entries[entries.length - 1].amount;
            document.getElementById('currentNetWorth').textContent = formatCurrency(current);

            // Calculate statistics
            const periods = [
                { label: '1 Week', days: 7 },
                { label: '1 Month', days: 30 },
                { label: '3 Months', days: 90 },
                { label: '1 Year', days: 365 },
                { label: '5 Years', days: 1825 }
            ];

            document.getElementById('statsGrid').innerHTML = periods.map(period => {
                const currentDate = new Date(entries[entries.length - 1].date);
                const targetDate = new Date(currentDate);
                targetDate.setDate(targetDate.getDate() - period.days);
                
                let pastEntry = entries[0];
                for (let entry of entries) {
                    if (new Date(entry.date) <= targetDate) pastEntry = entry;
                }
                
                const change = entries[entries.length - 1].amount - pastEntry.amount;
                const percent = pastEntry.amount !== 0 ? (change / Math.abs(pastEntry.amount)) * 100 : 0;
                const color = change >= 0 ? '#68d391' : '#fc8181';
                
                return `
                    <div class="stat-card">
                        <div class="stat-label">${period.label}</div>
                        <div class="stat-value" style="color: ${color}">${formatCurrency(change)}</div>
                        <div class="stat-percent">${percent >= 0 ? '+' : ''}${percent.toFixed(1)}%</div>
                    </div>
                `;
            }).join('');

            // Update history list
            document.getElementById('historyList').innerHTML = [...entries].reverse().map((entry, i) => {
                const originalIndex = entries.length - 1 - i;
                const prev = originalIndex > 0 ? entries[originalIndex - 1] : null;
                let changeHtml = '';
                
                if (prev) {
                    const change = entry.amount - prev.amount;
                    const color = change >= 0 ? '#38a169' : '#e53e3e';
                    changeHtml = `<span style="color: ${color}; font-weight: 600; margin-left: 10px;">${change >= 0 ? '+' : ''}${formatCurrency(change)}</span>`;
                }
                
                return `
                    <div class="history-item">
                        <div>
                            <strong>📅 ${entry.date}</strong>
                            ${changeHtml}
                        </div>
                        <div style="display: flex; align-items: center; gap: 15px;">
                            <span style="font-weight: bold; font-size: 1.1em;">${formatCurrency(entry.amount)}</span>
                            <button class="delete-btn" onclick="deleteEntry(${entry.id})">Delete</button>
                        </div>
                    </div>
                `;
            }).join('');

            // Update chart
            updateChart(entries);
        }

        function updateChart(entries) {
            const ctx = document.getElementById('chartCanvas').getContext('2d');
            if (chart) chart.destroy();
            if (!entries || entries.length === 0) return;

            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: entries.map(e => e.date),
                    datasets: [{
                        label: 'Net Worth',
                        data: entries.map(e => e.amount),
                        borderColor: '#667eea',
                        backgroundColor: 'rgba(102, 126, 234, 0.1)',
                        borderWidth: 2.5,
                        fill: true,
                        tension: 0.3,
                        pointRadius: 3,
                        pointBackgroundColor: '#667eea'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { 
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                label: (ctx) => ' ' + formatCurrency(ctx.parsed.y)
                            }
                        }
                    },
                    scales: {
                        y: {
                            ticks: {
                                callback: (value) => formatCurrency(value),
                                maxTicksLimit: 6
                            }
                        },
                        x: { ticks: { maxTicksLimit: 8 } }
                    }
                }
            });
        }

        // Initialize
        document.getElementById('dateInput').value = new Date().toISOString().split('T')[0];
        
        // Enter key to save
        document.getElementById('amountInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addEntry();
        });

        // Load data on page load
        fetchEntries();
    </script>
</body>
</html>
